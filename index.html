<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Addison - Executive function made simple</title>
  <link rel="icon" href="images/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/favicon/android-chrome-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="images/favicon/android-chrome-512.png">
  <meta name="theme-color" content="#ffffff">
  <style>
    :root {
    --app-red: #b71c1c;
    --text-dark: #4b4b4b;
    --text-muted: #8d8d8d;
    --line: #eeeeee;
    --white: #ffffff;
    --app-red-hover: #d32f2f;
    --secondary-blue: #1cb0f6;
    --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    --max-width: 1200px;
    }

    * {
    box-sizing: border-box;
    }

    html, body {
    margin: 0;
    padding: 0;
    background: var(--white);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    img {
    max-width: 100%;
    display: block;
    }

    a {
    text-decoration: none;
    }

    /* PAGE */
    .page {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    }

    /* HEADER — shrinks exactly to logo */
    .header {
    width: 100%;
    background: var(--white);
    position: sticky;
    top: 0;
    z-index: 20;
    }

    /* CRITICAL: no padding, no forced height */
    .header-inner {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 0;
    height: auto;
    min-height: unset;
    display: flex;
    align-items: center;
    justify-content: space-between;
    }

    /* removes extra inline spacing */
    .brand {
    display: inline-flex;
    align-items: center;
    line-height: 0;
    }

    /* THIS controls header height */
    .brand img {
    height: 84px; /* your logo size */
    width: auto;
    display: block;
    }

    /* NAV */
    .nav {
    display: flex;
    align-items: center;
    gap: 12px;
    }

    .nav-link {
    color: var(--text-muted);
    font-size: 0.9rem;
    font-weight: 800;
    text-transform: uppercase;
    padding: 10px 14px;
    border-radius: 999px;
    }

    .nav-link:hover {
    color: var(--app-red);
    }

    /* HERO WRAP — no spacing at all */
    .hero-wrap {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 0;
    margin: 0;
    }

    /* HERO — flush with header */
    .hero {
    width: 100%;
    max-width: var(--max-width);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
    padding: 0;
    margin: 0;
    }

    /* LEFT IMAGE (unchanged per your constraint) */
    .hero-art {
    display: flex;
    align-items: center;
    justify-content: center;
    }

    .hero-art-inner {
    width: min(100%, 460px);
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    }

    .hero-copy {
    display: grid;
    grid-template-rows: auto auto auto;
    align-content: center;   /* THIS is the key */
    justify-items: center;
    text-align: center;
    height: 100%;
    gap: 16px;
    }

    .headline {
    margin: 0;
    max-width: 560px;
    color: var(--text-dark);
    font-size: clamp(1.33rem, 4vw, 2.26667rem);
    font-weight: 800;
    line-height: 1.2;
    }

    .subcopy {
    margin: 0;
    color: #666;
    }

    .subheadline {
      margin: 0;
      color: var(--text-dark);
      font-style: italic;
      font-size: clamp(1.1rem, 2.5vw, 1.6rem); /* between headline + subcopy */
      font-weight: 700;
      line-height: 1.3;
    }

    /* CTA */
    .cta-group {
    width: min(100%, 360px);
    }

    .btn {
    width: 100%;
    min-height: 56px;
    border: none;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    text-transform: uppercase;
    background: var(--app-red);
    color: white;
    }

    .btn:hover {
    background: var(--app-red-hover);
    }

    /* FOOTER */
    .footer {
    border-top: 1px solid var(--line);
    padding: 24px 20px;
    margin-top: auto;
    }

    .footer-inner {
    max-width: var(--max-width);
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: nowrap;
    }

    .footer-left {
    font-size: 0.85rem;
    color: var(--text-muted);
    }

    .footer-right {
    display: flex;
    align-items: center;
    gap: 20px;
    }

    .footer-social {
    display: flex;
    gap: 16px;
    }

    .footer-social a {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    transition: color 0.2s ease;
    }

    .footer-social a:hover {
    color: var(--app-red);
    }

    .footer-links {
    display: flex;
    gap: 24px;
    }

    .footer-links a {
    font-size: 0.85rem;
    color: var(--text-muted);
    transition: color 0.2s ease;
    }

    .footer-links a:hover {
    color: var(--app-red);
    }

    /* MOBILE */
    @media (max-width: 920px) {
    .hero {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .hero-art-inner {
        width: min(100%, 350px);
    }
    }

    @media (max-width: 640px) {
    .header-inner {
        align-items: flex-start;
        padding: 0;
    }

    .nav {
        width: auto;
    }

    .nav-link {
        padding-top: 34px;
    }

    .headline {
        max-width: 375px;
    }

    .hero {
        padding: 0;
    }

    .hero-art-inner {
        width: min(100%, 280px);
    }

    .footer-left {
        white-space: nowrap;
        font-size: 0.75rem;
    }

    .footer-links {
        gap: 12px;
    }

    .footer-links a {
        font-size: 0.75rem;
    }

    .footer-social {
        gap: 12px;
    }

    .footer-social a {
        width: 20px;
        height: 20px;
    }
    }
    </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="Home">
          <img src="images/title.webp" alt="Addison" />
        </a>

        <nav class="nav" aria-label="Primary navigation">
          <a class="nav-link" href="about.html">About</a>
          <a class="nav-link" href="resources.html">Resources</a>
        </nav>
      </div>
    </header>

    <main class="hero-wrap">
      <section class="hero">
        <div class="hero-art">
          <div class="hero-art-inner">
            <!-- Replace with your real character/animal cluster image file -->
            <img src="images/cluster.webp" alt="Addys" />
          </div>
        </div>

        <div class="hero-copy">
          <h1 class="headline">Your clear to-do list that helps you plan, focus, and follow through.</h1>
          <h2 class="subheadline">Executive function made simple.</h2>
          <p class="subcopy"> Get started in seconds.</p>

          <div class="cta-group">
            <a class="btn btn-primary" href="https://apps.apple.com/us/app/addison-whats-your-next-move/id6751917243" target="_blank" rel="noopener noreferrer">
              Download on Mobile
            </a>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-left">
          © 2025-2026 myaddisonapp. All rights reserved
        </div>
        <div class="footer-right">
          <div class="footer-social">
            <a href="https://www.instagram.com/myaddisonapp" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <circle cx="17.5" cy="6.5" r="1.5"></circle>
              </svg>
            </a>
            <a href="https://www.tiktok.com/@myaddisonapp" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path>
              </svg>
            </a>
          </div>
          <div class="footer-links">
            <a href="terms.html">Terms of Use</a>
            <a href="privacy.html">Privacy Policy</a>
          </div>
        </div>
      </div>
    </footer>
  </div>
  <script>
    const header = document.querySelector('.header');
    
    window.addEventListener('scroll', () => {
      if (window.scrollY > 0) {
        header.classList.add('scrolled');
      } else {
        header.classList.remove('scrolled');
      }
    });
  </script>
</body>
</html>
